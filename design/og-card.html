<!doctype html>
<!--
  Legacy browser generator for public/og.png (1200x630).
  Prefer: python3 scripts/generate-brand-assets.py
  That script draws the same star field, adds brand/mascot.png, and writes
  favicons + PWA icons too. Keep star params in sync with src/DriftSky.tsx
  if the waitlist sky changes.
-->
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;background:#111;font-family:-apple-system,sans-serif;color:#ddd}
  #bar{padding:14px 16px}
  a{color:#0a84ff}
</style></head>
<body>
<div id="bar"><a id="dl" download="og.png">Download og.png</a></div>
<canvas id="c" width="1200" height="630" style="width:600px;height:315px"></canvas>
<script>
// Recreate the shipped DriftSky field (src/DriftSky.tsx) as one still frame,
// sized for a 1200x630 social card. Same star params so the card matches
// the real black waitlist sky exactly.
const W = 1200, H = 630;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Seeded RNG so the card is reproducible run-to-run.
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
const rand = mulberry32(0x5EED11);

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  // DriftSky density formula, same as the app.
  const count = Math.min(300, Math.floor((W*H)/3600));
  for (let i=0;i<count;i++){
    const depth = rand();
    const x = rand()*W;
    const y = rand()*H;
    const size = 0.5 + depth*1.6;
    const base = 0.1 + depth*0.45;
    const hot = rand() < 0.04;
    const tw = 0.7 + 0.3*Math.sin(rand()*6.28); // frozen twinkle phase
    ctx.beginPath();
    ctx.arc(x,y,size,0,6.2832);
    if (hot){
      ctx.fillStyle = `rgba(10,132,255,${base+0.2})`;
      ctx.shadowColor = 'rgba(10,132,255,.8)';
      ctx.shadowBlur = 6;
    } else {
      ctx.fillStyle = `rgba(255,255,255,${base*tw})`;
      ctx.shadowBlur = 0;
    }
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Brand type. Tokens pulled from index.css: headline #f5f5f7 weight 600
  // letter-spacing -0.03em; sub #b8b8bd; eyebrow #98989d 0.16em uppercase.
  // Anchored lower-left, echoing the old share card's composition.
  const padL = 80;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#f5f5f7';
  ctx.font = '600 104px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.letterSpacing = '-3px';
  ctx.fillText('Haven', padL, 458);

  ctx.letterSpacing = '0px';
  ctx.fillStyle = '#b8b8bd';
  ctx.font = '400 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('A personal memory layer over the people of your life.', padL, 512);

  ctx.fillStyle = '#98989d';
  ctx.font = '500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.letterSpacing = '3px';
  ctx.fillText('INHAVENS.COM', padL, 578);
  ctx.letterSpacing = '0px';
}

// Wait for the system font to be ready so metrics are right, then draw and
// wire the download link to the rendered PNG.
document.fonts.ready.then(()=>{ draw(); document.getElementById('dl').href = canvas.toDataURL('image/png'); });
</script>
</body>
</html>
