<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grilling round 3: what the lens reveals</title>
<style>
  :root {
    --ink: #f5f5f7; --muted: #98989d; --blue: #0a84ff; --star: #FFD9A0;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #000; color: var(--ink); font-family: var(--sans); overflow: hidden; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame {
    position: relative; overflow: hidden; background: #000; cursor: none;
    transition: width 260ms var(--ease), height 260ms var(--ease), border-radius 260ms var(--ease);
  }
  #frame[data-vp="desktop"] { width: 100vw; height: 100vh; border-radius: 0; }
  #frame[data-vp="phone"] {
    width: 390px; height: 780px; max-height: 94vh; border-radius: 34px;
    border: 1px solid #ffffff1f; box-shadow: 0 30px 90px #000;
  }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; }

  .wl-content { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 6vh 24px 7vh; z-index: 1; pointer-events: none; }
  #frame[data-vp="phone"] .wl-content { padding: 7vh 22px 6vh; }
  .wl-bottom { margin-top: auto; }
  #frame[data-vp="desktop"] .wl-content { align-items: center; justify-content: center; text-align: center; }
  #frame[data-vp="desktop"] .wl-bottom { margin-top: 26px; }
  .wl-eyebrow { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .wl-headline { margin: 0; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; font-size: clamp(38px, 6.4vw, 68px); text-wrap: balance; }
  #frame[data-vp="phone"] .wl-headline { font-size: 40px; }
  .wl-sub { margin: 18px 0 0; color: var(--muted); font-size: 17px; line-height: 1.5; max-width: 34ch; }
  #frame[data-vp="desktop"] .wl-sub { margin-inline: auto; }
  .wl-form { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
  #frame[data-vp="desktop"] .wl-form { align-items: center; }
  .wl-row { display: flex; gap: 10px; width: 100%; max-width: 460px; }
  .wl-field { flex: 1; min-width: 0; background: #ffffff14; border: 1px solid #ffffff24; border-radius: 14px; padding: 15px 17px; font: 17px var(--sans); color: var(--ink); cursor: text; }
  .wl-field::placeholder { color: #ffffff5c; }
  .wl-field:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px #0a84ff26; }
  .wl-go { background: var(--blue); color: #fff; border: 0; border-radius: 14px; padding: 15px 24px; font: 600 17px var(--sans); cursor: pointer; white-space: nowrap; }
  .wl-fine { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  #frame[data-vp="desktop"] .wl-fine { text-align: center; }

  #picker {
    position: fixed; right: 20px; bottom: 20px; z-index: 9999; width: 272px;
    background: #16161acc; backdrop-filter: blur(18px); border: 1px solid #ffffff1f;
    border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
    font-size: 13px; box-shadow: 0 18px 50px #000a; user-select: none; cursor: default;
  }
  #grab { cursor: grab; display: flex; align-items: center; justify-content: space-between; }
  #grab:active { cursor: grabbing; }
  #grab b { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #8a8a90; font-weight: 600; }
  #hide { background: none; border: 0; color: #8a8a90; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav button { width: 34px; height: 34px; flex: none; background: #ffffff14; border: 1px solid #ffffff1f; border-radius: 10px; color: var(--ink); font-size: 15px; cursor: pointer; }
  .nav button:hover { background: #ffffff24; }
  .nav .who { flex: 1; text-align: center; }
  .nav .who b { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .nav .who span { font-size: 11px; color: #8a8a90; font-variant-numeric: tabular-nums; }
  .desc { margin: 0; color: #a8a8ae; font-size: 12px; line-height: 1.45; min-height: 62px; }
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; padding: 7px 4px; font-size: 11px; font-weight: 600; background: #ffffff0f; border: 1px solid #ffffff1a; border-radius: 8px; color: #a8a8ae; cursor: pointer; }
  .seg button.on { background: var(--ink); color: #16161a; border-color: transparent; }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #6e6e75; margin-bottom: -4px; }
  #note { margin: 0; font-size: 11px; line-height: 1.45; padding: 8px 9px; border-radius: 9px; border: 1px solid #A8DDB04d; background: #9fd6a81a; color: #A8DDB0; }
  #show { position: fixed; right: 20px; bottom: 20px; z-index: 9999; display: none; background: #16161acc; backdrop-filter: blur(18px); border: 1px solid #ffffff1f; border-radius: 12px; padding: 9px 14px; color: var(--ink); font: 600 12px var(--sans); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { #frame { transition: none; } }
</style>
</head>
<body>

<div id="stage"><div id="frame" data-vp="desktop"><canvas id="sky"></canvas></div></div>

<button id="show">Show picker</button>
<div id="picker">
  <div id="grab"><b>What the lens reveals</b><button id="hide" title="Hide">&times;</button></div>
  <div class="nav">
    <button id="prev" aria-label="Previous">&#8592;</button>
    <div class="who"><b id="vname"></b><span id="vnum"></span></div>
    <button id="next" aria-label="Next">&#8594;</button>
  </div>
  <p class="desc" id="vdesc"></p>
  <div class="lbl">Viewport</div>
  <div class="seg" id="vpseg">
    <button data-vp="desktop" class="on">Desktop</button>
    <button data-vp="phone">Phone</button>
  </div>
  <div class="lbl">Lens size</div>
  <div class="seg" id="szseg">
    <button data-sz="130">Small</button>
    <button data-sz="180" class="on">Medium</button>
    <button data-sz="250">Large</button>
  </div>
  <p id="note">Hand-built optics, so no Chrome flag and no origin trial. This is what would actually ship.</p>
</div>

<script>
(function () {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* -------------------------------------------------------------------------
     Round 3. Lens won on form; this round is about meaning. Each variant keeps
     identical glass optics and changes only what becomes visible through them,
     because the optics are settled and the question now is what the gesture is
     SAYING. The whole lens is hand-drawn into the star canvas rather than run
     through Canvas UI's Glass, for one hard reason: Glass captures DOM, and the
     star field is a <canvas>, which cannot be captured. Building it ourselves
     also drops the Chrome-flag requirement entirely.
  ------------------------------------------------------------------------- */
  const VARIANTS = [
    { id: "constellation", name: "Constellation",
      desc: "Outside the lens: scattered points. Inside: they join up. This is the headline rendered as an interaction - Haven is the thing that turns people into a constellation." },
    { id: "names", name: "Names",
      desc: "Every star inside the lens carries someone's name. The most literal reading of the product: these points are people, and Haven is where they stop being anonymous." },
    { id: "warmth", name: "Warmth",
      desc: "Same stars, but inside the lens the cold blue-white sky turns ember and the stars bloom. Nothing new is revealed - it just becomes warmer where you look." },
    { id: "depth", name: "Depth",
      desc: "The lens shows far more stars than the naked eye sees. Says: you know more people than you remember, and Haven is what surfaces them." },
    { id: "drift", name: "Drift",
      desc: "Inside the lens each star trails, showing where it has been. People drift away over time; the lens is what lets you see the movement." },
  ];

  /* The name pool is deliberately mundane and mixed - a real address book, not
     a cast list. */
  const NAMES = ["Sarah", "Marcus", "Priya", "Diego", "Yuki", "Amara", "Tom",
                 "Lena", "Omar", "Ines", "Kai", "Nadia", "Ben", "Rosa", "Ivan",
                 "Mei", "Jonas", "Aisha", "Theo", "Clara", "Nils", "Farah",
                 "Luca", "Sofia", "Hugo", "Noor", "Emil", "Tara", "Rafa",
                 "Anya", "Pavel", "Leila", "Silas", "Mira", "Kofi", "Elif",
                 "Bruno", "Zoya", "Anton", "Iris"];

  let vi = 0, vp = "desktop", R = 180;
  const frame = document.getElementById("frame");
  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d");

  let w = 0, h = 0, stars = [], deep = [], raf = 0;
  // Lens position eases toward the pointer, so the glass has weight instead of
  // snapping. `on` fades the whole thing in and out at the frame edge.
  const lens = { x: -999, y: -999, tx: -999, ty: -999, on: 0 };

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function build() {
    resize();
    const count = Math.min(300, Math.floor((w * h) / 3600));
    stars = [];
    for (let i = 0; i < count; i++) {
      const d = Math.random();
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        size: 0.5 + d * 1.6, base: 0.1 + d * 0.45, sp: 0.05 + d * 0.22,
        tw: Math.random() * 6.28, hot: Math.random() < 0.04,
        name: NAMES[i % NAMES.length],
      });
    }
    // A second, denser field that only ever exists inside the lens.
    deep = [];
    for (let i = 0; i < count * 2.2; i++) {
      const d = Math.random();
      deep.push({ x: Math.random() * w, y: Math.random() * h,
                  size: 0.35 + d * 0.9, base: 0.08 + d * 0.3, tw: Math.random() * 6.28 });
    }
  }

  // Magnification about the lens centre. Points outside the source radius are
  // never drawn, so the disc fills without smearing the rim.
  const SRC = () => R / ZOOM;
  const ZOOM = 1.28;
  function warp(p) {
    return { x: lens.x + (p.x - lens.x) * ZOOM, y: lens.y + (p.y - lens.y) * ZOOM };
  }
  function near(p, r) {
    const dx = p.x - lens.x, dy = p.y - lens.y;
    return dx * dx + dy * dy < r * r;
  }

  /* Prim's minimum spanning tree, same approach as src/sky.ts, so the figure
     reads calm rather than criss-crossed. */
  function mst(pts) {
    if (pts.length < 2) return [];
    const inTree = [0], edges = [];
    while (inTree.length < pts.length) {
      let best = null;
      for (const i of inTree) {
        for (let j = 0; j < pts.length; j++) {
          if (inTree.includes(j)) continue;
          const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
          const d = dx * dx + dy * dy;
          if (!best || d < best.d) best = { i, j, d };
        }
      }
      if (!best) break;
      edges.push([best.i, best.j]);
      inTree.push(best.j);
    }
    return edges;
  }

  function drawStar(s, time, alphaMul, tint) {
    const tw = reduce ? 1 : 0.7 + 0.3 * Math.sin(time * 1.3 + s.tw);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, 6.2832);
    if (tint) {
      // Clamped, because the revealed layer runs at high alphaMul on purpose
      // and unclamped values wash the disc out to flat cream.
      const a = Math.min(s.base * tw * alphaMul, 0.95);
      ctx.fillStyle = "rgba(255,226,180," + a.toFixed(3) + ")";
      ctx.shadowColor = "rgba(255,200,130,.95)"; ctx.shadowBlur = 12;
    } else if (s.hot) {
      ctx.fillStyle = "rgba(10,132,255," + ((s.base + 0.2) * alphaMul) + ")";
      ctx.shadowColor = "rgba(10,132,255,.8)"; ctx.shadowBlur = 6;
    } else {
      ctx.fillStyle = "rgba(255,255,255," + (s.base * tw * alphaMul) + ")";
      ctx.shadowBlur = 0;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function revealConstellation(time) {
    const inside = stars.filter(s => near(s, SRC()) && s.size > 0.95);
    const pts = inside.map(warp);
    // Drawn twice: a wide soft pass for glow, a tight one for the actual line.
    const edges = mst(pts);
    ctx.strokeStyle = "rgba(255,217,160,0.16)";
    ctx.lineWidth = 3.5;
    for (const [a, b] of edges) {
      ctx.beginPath();
      ctx.moveTo(pts[a].x, pts[a].y);
      ctx.lineTo(pts[b].x, pts[b].y);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(255,226,180,0.8)";
    ctx.lineWidth = 1;
    for (const [a, b] of edges) {
      ctx.beginPath();
      ctx.moveTo(pts[a].x, pts[a].y);
      ctx.lineTo(pts[b].x, pts[b].y);
      ctx.stroke();
    }
    inside.forEach((s, i) => {
      const p = pts[i];
      drawStar({ ...s, x: p.x, y: p.y, size: s.size * 1.45 }, time, 2.6, true);
    });
  }

  function revealNames(time) {
    const inside = stars.filter(s => near(s, SRC()) && s.size > 1.15);
    ctx.font = "500 11px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    for (const s of inside) {
      const p = warp(s);
      drawStar({ ...s, x: p.x, y: p.y, size: s.size * 1.1 }, time, 1.3, true);
      // Fade labels toward the rim so the disc has a soft edge, not a hard cut.
      const d = Math.hypot(p.x - lens.x, p.y - lens.y) / R;
      ctx.fillStyle = "rgba(255,217,160," + (0.9 * (1 - d * d)).toFixed(3) + ")";
      ctx.fillText(s.name, p.x, p.y - 9);
    }
  }

  function revealWarmth(time) {
    const g = ctx.createRadialGradient(lens.x, lens.y, 0, lens.x, lens.y, R);
    g.addColorStop(0, "rgba(232,168,124,0.20)");
    g.addColorStop(1, "rgba(232,168,124,0)");
    ctx.fillStyle = g;
    ctx.fillRect(lens.x - R, lens.y - R, R * 2, R * 2);
    for (const s of stars) {
      if (!near(s, SRC())) continue;
      const p = warp(s);
      drawStar({ ...s, x: p.x, y: p.y, size: s.size * 1.2 }, time, 1.5, true);
    }
  }

  function revealDepth(time) {
    // Both passes run hot: the base sky under the lens is dimmed to 0.28, so
    // anything drawn at normal alpha reads as emptier rather than deeper.
    for (const s of deep) {
      if (!near(s, SRC())) continue;
      const p = warp(s);
      drawStar({ ...s, x: p.x, y: p.y, size: s.size * 1.1 }, time, 2.6, false);
    }
    for (const s of stars) {
      if (!near(s, SRC())) continue;
      const p = warp(s);
      drawStar({ ...s, x: p.x, y: p.y, size: s.size * 1.2 }, time, 2.4, false);
    }
  }

  function revealDrift(time) {
    for (const s of stars) {
      if (!near(s, SRC())) continue;
      const p = warp(s);
      // The trail runs backwards along the star's own drift direction, so it
      // reads as history rather than motion blur.
      const len = 26 + s.sp * 90;
      const g = ctx.createLinearGradient(p.x - len, p.y, p.x, p.y);
      g.addColorStop(0, "rgba(255,217,160,0)");
      g.addColorStop(1, "rgba(255,217,160," + (s.base * 0.9).toFixed(3) + ")");
      ctx.strokeStyle = g;
      ctx.lineWidth = Math.max(s.size * 0.85, 0.6);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(p.x - len, p.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      drawStar({ ...s, x: p.x, y: p.y, size: s.size * 1.1 }, time, 1.3, true);
    }
  }

  const REVEAL = {
    constellation: revealConstellation, names: revealNames,
    warmth: revealWarmth, depth: revealDepth, drift: revealDrift,
  };

  // Glass, drawn rather than simulated: a darkened well, a bright rim, and a
  // single specular highlight. Cheap, and it survives without the Chrome flag.
  function drawGlass() {
    const a = lens.on;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const inner = ctx.createRadialGradient(lens.x, lens.y, R * 0.55, lens.x, lens.y, R);
    inner.addColorStop(0, "rgba(255,255,255,0)");
    inner.addColorStop(1, "rgba(255,255,255," + (0.05 * a).toFixed(3) + ")");
    ctx.fillStyle = inner;
    ctx.beginPath(); ctx.arc(lens.x, lens.y, R, 0, 6.2832); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = "rgba(255,255,255," + (0.34 * a).toFixed(3) + ")";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(lens.x, lens.y, R, 0, 6.2832); ctx.stroke();

    ctx.strokeStyle = "rgba(255,217,160," + (0.20 * a).toFixed(3) + ")";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(lens.x, lens.y, R - 2, 0, 6.2832); ctx.stroke();

    ctx.strokeStyle = "rgba(255,255,255," + (0.42 * a).toFixed(3) + ")";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(lens.x, lens.y, R - 1, Math.PI * 1.12, Math.PI * 1.42);
    ctx.stroke();
  }

  function frameLoop(t) {
    const time = t / 1000;
    ctx.clearRect(0, 0, w, h);

    lens.x += (lens.tx - lens.x) * 0.16;
    lens.y += (lens.ty - lens.y) * 0.16;

    // Base sky. Dimmed under the lens so the revealed layer reads as a
    // different world rather than a double exposure.
    for (const s of stars) {
      if (!reduce) { s.x += s.sp; if (s.x > w + 2) s.x = -2; }
      const dim = lens.on > 0.01 && near(s, R) ? 0.28 : 1;
      drawStar(s, time, dim, false);
    }

    if (lens.on > 0.01) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(lens.x, lens.y, R, 0, 6.2832);
      ctx.clip();
      ctx.globalAlpha = lens.on;
      REVEAL[VARIANTS[vi].id](time);
      ctx.globalAlpha = 1;
      ctx.restore();
      drawGlass();
    }

    raf = requestAnimationFrame(frameLoop);
  }

  frame.addEventListener("pointermove", (e) => {
    const r = frame.getBoundingClientRect();
    lens.tx = e.clientX - r.left; lens.ty = e.clientY - r.top;
    if (lens.on === 0) { lens.x = lens.tx; lens.y = lens.ty; }
    lens.on = Math.min(lens.on + 0.34, 1);
  });
  frame.addEventListener("pointerleave", () => { lens.on = 0; });

  function contentHTML() {
    const c = vp === "desktop"
      ? { headline: "Your people are a constellation.",
          sub: "Every person you meet becomes a point of light - and Haven keeps them from drifting away.",
          cta: "Join", fine: "Private beta" }
      : { headline: "The people you meet, never lost again.",
          sub: "A quiet memory layer over the people of your life. Get in early.",
          cta: "Request access", fine: "No spam. Invites go out in waves." };
    return '<div class="wl-content"><div class="wl-top">' +
      '<span class="wl-eyebrow">Haven - private beta</span>' +
      '<h1 class="wl-headline">' + c.headline + '</h1></div>' +
      '<div class="wl-bottom"><p class="wl-sub">' + c.sub + '</p>' +
      '<form class="wl-form" onsubmit="return false"><div class="wl-row">' +
      '<input class="wl-field" placeholder="Your name" aria-label="Your name">' +
      '<button class="wl-go" type="submit">' + c.cta + '</button></div></form>' +
      '<p class="wl-fine">' + c.fine + '</p></div></div>';
  }

  function mountContent() {
    const old = frame.querySelector(".wl-content");
    if (old) old.remove();
    frame.insertAdjacentHTML("beforeend", contentHTML());
  }

  function paint() {
    const v = VARIANTS[vi];
    document.getElementById("vname").textContent = v.name;
    document.getElementById("vnum").textContent = (vi + 1) + " / " + VARIANTS.length;
    document.getElementById("vdesc").textContent = v.desc;
  }
  function go(d) { vi = (vi + d + VARIANTS.length) % VARIANTS.length; paint(); }

  document.getElementById("prev").onclick = () => go(-1);
  document.getElementById("next").onclick = () => go(1);
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });
  document.getElementById("vpseg").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    vp = b.dataset.vp; frame.dataset.vp = vp;
    [...e.currentTarget.children].forEach(x => x.classList.toggle("on", x === b));
    setTimeout(() => { build(); mountContent(); }, 300);
  };
  document.getElementById("szseg").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    R = +b.dataset.sz;
    [...e.currentTarget.children].forEach(x => x.classList.toggle("on", x === b));
  };

  const picker = document.getElementById("picker"), grab = document.getElementById("grab");
  let drag = null;
  grab.addEventListener("pointerdown", (e) => {
    const r = picker.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener("pointermove", (e) => {
    if (!drag) return;
    picker.style.left = (e.clientX - drag.dx) + "px";
    picker.style.top = (e.clientY - drag.dy) + "px";
    picker.style.right = "auto"; picker.style.bottom = "auto";
  });
  grab.addEventListener("pointerup", () => { drag = null; });
  const showBtn = document.getElementById("show");
  document.getElementById("hide").onclick = () => { picker.style.display = "none"; showBtn.style.display = "block"; };
  showBtn.onclick = () => { picker.style.display = "flex"; showBtn.style.display = "none"; };

  addEventListener("resize", () => { build(); });
  build();
  mountContent();
  paint();
  raf = requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
