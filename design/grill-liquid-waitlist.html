<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grilling: Liquid on the Haven waitlist</title>
<style>
  :root {
    --ink: #f5f5f7;
    --muted: #98989d;
    --blue: #0a84ff;
    --star: #FFD9A0;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000;
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* ---- stage: a phone-or-desktop framed viewport of the real waitlist ---- */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #frame {
    position: relative;
    overflow: hidden;
    background: #000;
    transition: width 260ms var(--ease), height 260ms var(--ease), border-radius 260ms var(--ease);
  }
  #frame[data-vp="desktop"] { width: 100vw; height: 100vh; border-radius: 0; }
  #frame[data-vp="phone"] {
    width: 390px; height: 780px; max-height: 94vh;
    border-radius: 34px; border: 1px solid #ffffff1f;
    box-shadow: 0 30px 90px #000;
  }

  #sky { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---- waitlist chrome, ported from src/index.css intent ---- */
  .wl-content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 6vh 24px 7vh;
    z-index: 1;
  }
  #frame[data-vp="phone"] .wl-content { padding: 7vh 22px 6vh; }
  .wl-top { }
  .wl-bottom { margin-top: auto; }
  #frame[data-vp="desktop"] .wl-content {
    align-items: center; justify-content: center; text-align: center;
  }
  #frame[data-vp="desktop"] .wl-bottom { margin-top: 26px; }
  .wl-eyebrow {
    display: block; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .wl-headline {
    margin: 0; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05;
    font-size: clamp(38px, 6.4vw, 68px); text-wrap: balance;
  }
  #frame[data-vp="phone"] .wl-headline { font-size: 40px; }
  .wl-sub {
    margin: 18px 0 0; color: var(--muted); font-size: 17px; line-height: 1.5;
    max-width: 34ch;
  }
  #frame[data-vp="desktop"] .wl-sub { margin-inline: auto; }
  .wl-form { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  #frame[data-vp="desktop"] .wl-form { align-items: center; }
  .wl-row { display: flex; gap: 10px; width: 100%; max-width: 460px; }
  .wl-field {
    flex: 1; min-width: 0;
    background: #ffffff14; border: 1px solid #ffffff24; border-radius: 14px;
    padding: 15px 17px; font: 17px var(--sans); color: var(--ink);
  }
  .wl-field::placeholder { color: #ffffff5c; }
  .wl-field:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px #0a84ff26; }
  .wl-go {
    background: var(--blue); color: #fff; border: 0; border-radius: 14px;
    padding: 15px 24px; font: 600 17px var(--sans); cursor: pointer; white-space: nowrap;
  }
  .wl-fine { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  #frame[data-vp="desktop"] .wl-fine { text-align: center; }
  .wl-joined { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 10px; }
  .wl-check { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--blue); display: flex; align-items: center; justify-content: center; }
  .wl-check svg { width: 24px; height: 24px; }
  .wl-checkline { margin: 6px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }

  /* ---- picker ---- */
  #picker {
    position: fixed; right: 20px; bottom: 20px; z-index: 9999;
    width: 268px;
    background: #16161acc; backdrop-filter: blur(18px);
    border: 1px solid #ffffff1f; border-radius: 16px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
    font-size: 13px; box-shadow: 0 18px 50px #000a;
    user-select: none;
  }
  #grab { cursor: grab; display: flex; align-items: center; justify-content: space-between; }
  #grab:active { cursor: grabbing; }
  #grab b { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #8a8a90; font-weight: 600; }
  #hide { background: none; border: 0; color: #8a8a90; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav button {
    width: 34px; height: 34px; flex: none;
    background: #ffffff14; border: 1px solid #ffffff1f; border-radius: 10px;
    color: var(--ink); font-size: 15px; cursor: pointer;
  }
  .nav button:hover { background: #ffffff24; }
  .nav .who { flex: 1; text-align: center; }
  .nav .who b { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .nav .who span { font-size: 11px; color: #8a8a90; font-variant-numeric: tabular-nums; }
  .desc { margin: 0; color: #a8a8ae; font-size: 12px; line-height: 1.45; min-height: 50px; }
  .seg { display: flex; gap: 4px; }
  .seg button {
    flex: 1; padding: 7px 4px; font-size: 11px; font-weight: 600;
    background: #ffffff0f; border: 1px solid #ffffff1a; border-radius: 8px;
    color: #a8a8ae; cursor: pointer;
  }
  .seg button.on { background: var(--ink); color: #16161a; border-color: transparent; }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #6e6e75; margin-bottom: -4px; }
  #flag {
    margin: 0; font-size: 11px; line-height: 1.45; padding: 8px 9px; border-radius: 9px;
    border: 1px solid #E8A87C4d; background: #e8a87c1a; color: #E8A87C;
  }
  #flag.ok { border-color: #A8DDB04d; background: #9fd6a81a; color: #A8DDB0; }
  #show {
    position: fixed; right: 20px; bottom: 20px; z-index: 9999; display: none;
    background: #16161acc; backdrop-filter: blur(18px); border: 1px solid #ffffff1f;
    border-radius: 12px; padding: 9px 14px; color: var(--ink); font: 600 12px var(--sans); cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { #frame { transition: none; } }
</style>
</head>
<body>

<div id="stage">
  <div id="frame" data-vp="desktop"></div>
</div>

<button id="show">Show picker</button>
<div id="picker">
  <div id="grab"><b>Liquid on the waitlist</b><button id="hide" title="Hide">&times;</button></div>
  <div class="nav">
    <button id="prev" aria-label="Previous variant">&#8592;</button>
    <div class="who"><b id="vname">Ambient</b><span id="vnum">1 / 5</span></div>
    <button id="next" aria-label="Next variant">&#8594;</button>
  </div>
  <p class="desc" id="vdesc"></p>
  <div class="lbl">Viewport</div>
  <div class="seg" id="vpseg">
    <button data-vp="desktop" class="on">Desktop</button>
    <button data-vp="phone">Phone</button>
  </div>
  <div class="lbl">State</div>
  <div class="seg" id="stseg">
    <button data-st="form" class="on">Form</button>
    <button data-st="joined">Joined</button>
  </div>
  <p id="flag"></p>
</div>

<script type="module">
const DEFAULTS = {
  simResolution: 128,
  dyeResolution: 512,
  densityDissipation: 0.96,
  velocityDissipation: 1,
  pressure: 0.8,
  pressureIterations: 4,
  curl: 1.9,
  radius: 0.3,
  force: 1.1,
  intensity: 2,
  distortion: 0.4,
  blend: 5,
  color: [0.145, 0.239, 0.867],
  rainbow: false
};
const DT = 1 / 60;
function srgbToLinear(value) {
  return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
}
const VERT = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aPos;
out vec2 vUv;
out vec2 vL;
out vec2 vR;
out vec2 vT;
out vec2 vB;
uniform vec2 texelSize;
void main () {
  vUv = aPos * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;
const FRAG_DISPLAY = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uContent;
uniform sampler2D uFluid;
uniform vec3 uColor;
uniform float uDistortion;
uniform float uIntensity;
uniform float uBlend;
uniform float uRainbow;
uniform float uHasContent;
vec3 toLinear (vec3 c) {
  return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c));
}
vec3 toSrgb (vec3 c) {
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}
void main () {
  vec3 fluid = texture(uFluid, vUv).rgb;
  if (uHasContent < 0.5) {
    float mag = length(fluid);
    vec3 tint = uRainbow == 1.0
      ? clamp(fluid / max(mag, 1e-3), 0.0, 1.0)
      : uColor;
    float overlay = (1.0 - exp(-mag * uIntensity * 0.5)) * 0.82;
    outColor = vec4(toSrgb(clamp(tint, 0.0, 1.0)) * overlay, overlay);
    return;
  }
  vec2 uv = vUv - fluid.rg * uDistortion * 0.001;
  vec4 content = texture(uContent, vec2(uv.x, 1.0 - uv.y));
  content.rgb = toLinear(content.rgb);
  vec3 tint = uRainbow == 1.0 ? fluid : uColor * length(fluid);
  vec4 fluidColor = vec4(tint, 1.0);
  vec4 blended = mix(content, fluidColor, uBlend * 0.01 * clamp(length(fluid), 0.0, 1.0));
  vec4 final = mix(blended, vec4(0.0), 1.0 - content.a);
  outColor = vec4(toSrgb(clamp(final.rgb, 0.0, 1.0)), final.a);
}`;
const FRAG_SPLAT = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uTarget;
uniform float uAspect;
uniform vec3 uColor;
uniform vec2 uPoint;
uniform float uRadius;
void main () {
  vec2 p = vUv - uPoint;
  p.x *= uAspect;
  vec3 splat = exp(-dot(p, p) / uRadius) * uColor;
  vec3 base = texture(uTarget, vUv).xyz;
  outColor = vec4(base + splat, 1.0);
}`;
const FRAG_ADVECT = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 texelSize;
uniform float uDt;
uniform float uDissipation;
void main () {
  vec2 coord = vUv - uDt * texture(uVelocity, vUv).xy * texelSize;
  outColor = uDissipation * texture(uSource, coord);
  outColor.a = 1.0;
}`;
const FRAG_CLEAR = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uTexture;
uniform float uValue;
void main () {
  outColor = uValue * texture(uTexture, vUv);
}`;
const FRAG_DIVERGENCE = `#version 300 es
precision highp float;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 outColor;
uniform sampler2D uVelocity;
void main () {
  float L = texture(uVelocity, vL).x;
  float R = texture(uVelocity, vR).x;
  float T = texture(uVelocity, vT).y;
  float B = texture(uVelocity, vB).y;
  vec2 C = texture(uVelocity, vUv).xy;
  if (vL.x < 0.0) { L = -C.x; }
  if (vR.x > 1.0) { R = -C.x; }
  if (vT.y > 1.0) { T = -C.y; }
  if (vB.y < 0.0) { B = -C.y; }
  float div = 0.5 * (R - L + T - B);
  outColor = vec4(div, 0.0, 0.0, 1.0);
}`;
const FRAG_CURL = `#version 300 es
precision highp float;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 outColor;
uniform sampler2D uVelocity;
void main () {
  float L = texture(uVelocity, vL).y;
  float R = texture(uVelocity, vR).y;
  float T = texture(uVelocity, vT).x;
  float B = texture(uVelocity, vB).x;
  float vorticity = R - L - T + B;
  outColor = vec4(vorticity, 0.0, 0.0, 1.0);
}`;
const FRAG_VORTICITY = `#version 300 es
precision highp float;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 outColor;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float uCurlStrength;
uniform float uDt;
void main () {
  float L = texture(uCurl, vL).x;
  float R = texture(uCurl, vR).x;
  float T = texture(uCurl, vT).x;
  float B = texture(uCurl, vB).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = vec2(abs(T) - abs(B), abs(R) - abs(L)) * 0.5;
  force /= length(force) + 1.0;
  force *= uCurlStrength * C;
  force.y *= -1.0;
  vec2 velocity = texture(uVelocity, vUv).xy;
  outColor = vec4(velocity + force * uDt, 0.0, 1.0);
}`;
const FRAG_PRESSURE = `#version 300 es
precision highp float;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 outColor;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
void main () {
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  float divergence = texture(uDivergence, vUv).x;
  float pressure = (L + R + B + T - divergence) * 0.25;
  outColor = vec4(pressure, 0.0, 0.0, 1.0);
}`;
const FRAG_GRADIENT = `#version 300 es
precision highp float;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 outColor;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
void main () {
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  vec2 velocity = texture(uVelocity, vUv).xy;
  velocity.xy -= vec2(R - L, T - B);
  outColor = vec4(velocity, 0.0, 1.0);
}`;
function supportsHtmlInCanvas() {
  if (typeof document === "undefined") return false;
  const probe = document.createElement("canvas");
  const ctx = probe.getContext("2d");
  return Boolean(
    ctx && typeof ctx.drawElementImage === "function" && typeof probe.requestPaint === "function"
  );
}
function createLiquid(elements, options = {}) {
  const config = { ...DEFAULTS, ...options };
  const { source, content, output } = elements;
  const gl = output.getContext("webgl2", {
    alpha: true,
    depth: false,
    stencil: false,
    antialias: false,
    premultipliedAlpha: true
  });
  if (!gl || gl.isContextLost()) return null;
  const sourceCtx = source.getContext("2d");
  const paintable = source;
  const htmlInCanvas = Boolean(
    sourceCtx && typeof sourceCtx.drawElementImage === "function" && typeof paintable.requestPaint === "function"
  );
  let contentDirty = false;
  let wake = () => {
  };
  if (htmlInCanvas) {
    paintable.onpaint = () => {
      try {
        sourceCtx.reset();
        sourceCtx.drawElementImage(content, 0, 0);
        contentDirty = true;
        wake();
      } catch {
      }
    };
  }
  gl.getExtension("EXT_color_buffer_float");
  const supportsLinear = Boolean(gl.getExtension("OES_texture_float_linear"));
  const filtering = supportsLinear ? gl.LINEAR : gl.NEAREST;
  const shaders = [];
  function compile(type, source2) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source2);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error("Liquid shader error:", gl.getShaderInfoLog(shader));
    }
    shaders.push(shader);
    return shader;

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragSource));
    gl.linkProgram(program);
    programs.push(program);
    const uniforms = {};
    const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
      const info = gl.getActiveUniform(program, i);
      uniforms[info.name] = gl.getUniformLocation(program, info.name);
    }
    return { program, uniforms };
  }
  const displayProgram = createProgram(FRAG_DISPLAY);
  const splatProgram = createProgram(FRAG_SPLAT);
  const advectProgram = createProgram(FRAG_ADVECT);
  const clearProgram = createProgram(FRAG_CLEAR);
  const divergenceProgram = createProgram(FRAG_DIVERGENCE);
  const curlProgram = createProgram(FRAG_CURL);
  const vorticityProgram = createProgram(FRAG_VORTICITY);
  const pressureProgram = createProgram(FRAG_PRESSURE);
  const gradientProgram = createProgram(FRAG_GRADIENT);
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
    gl.STATIC_DRAW
  );
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  function createTarget(size, internalFormat, format, filter) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(
      gl.TEXTURE_2D,
      0,
      internalFormat,
      size,
      size,
      0,
      format,
      gl.HALF_FLOAT,
      null

    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

      gl.FRAMEBUFFER,
      gl.COLOR_ATTACHMENT0,
      gl.TEXTURE_2D,
      texture,
      0

    let read = createTarget(size, internalFormat, format, filter);
    let write = createTarget(size, internalFormat, format, filter);

      get read() {
        return read;
      },
      get write() {

        write = t;

    config.simResolution,
    gl.RG16F,
    gl.RG,
    filtering

    config.dyeResolution,
    gl.RGBA16F,
    gl.RGBA,
    filtering
  );

    config.simResolution,
    gl.R16F,
    gl.RED,
    gl.NEAREST

    config.simResolution,
    gl.R16F,
    gl.RED,
    gl.NEAREST

    [
      velocity.read,
      velocity.write,
      dye.read,
      dye.write,
      pressure.read,
      pressure.write,

  let texelX = 0;

    const width = Math.max(output.clientWidth, 1);
    const height = Math.max(output.clientHeight, 1);

    texelY = 1 / config.simResolution;
  }
  function syncCanvasSize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(output.clientWidth * dpr));
    const height = Math.max(1, Math.round(output.clientHeight * dpr));
    if (output.width !== width || output.height !== height) {
      output.width = width;
      output.height = height;
    }
    if (htmlInCanvas) {
      const cssWidth = Math.max(1, Math.round(source.clientWidth));
      const cssHeight = Math.max(1, Math.round(source.clientHeight));
      if (source.width !== cssWidth || source.height !== cssHeight) {
        source.width = cssWidth;
        source.height = cssHeight;
      }
      paintable.requestPaint();
    }
    updateTexelSize();
  }
  syncCanvasSize();
  const contentTexture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, contentTexture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(
    gl.TEXTURE_2D,
    0,
    gl.RGBA,
    1,
    1,
    0,
    gl.RGBA,
    gl.UNSIGNED_BYTE,
    new Uint8Array([0, 0, 0, 0])
  );
  function uploadContent() {
    if (!htmlInCanvas || !contentDirty) return;
    contentDirty = false;
    gl.bindTexture(gl.TEXTURE_2D, contentTexture);
    gl.texImage2D(
      gl.TEXTURE_2D,
      0,
      gl.RGBA,
      gl.RGBA,
      gl.UNSIGNED_BYTE,
      source
    );

/* ---------------------------------------------------------------------------
   Five ways Liquid could meet the waitlist. They differ in SCOPE (what the
   fluid is allowed to touch) before they differ in look, because scope is the
   real decision: warping the words costs legibility, warping only the sky
   costs nothing.
--------------------------------------------------------------------------- */
const VARIANTS = [
  {
    id: "ambient",
    name: "Ambient",
    desc: "Everything sits inside the fluid, but barely. Distortion 0.12, slow decay, ember trail. The page breathes when touched and is otherwise still.",
    scope: "all",
    opts: { color: [0.91, 0.66, 0.49], distortion: 0.12, intensity: 0.3, blend: 0.22,
            radius: 0.3, force: 4200, densityDissipation: 0.985, velocityDissipation: 0.2, curl: 12 },
  },
  {
    id: "backdrop",
    name: "Backdrop",
    desc: "Only a nebula layer goes in the fluid. Headline and form sit above it in plain DOM, so type stays perfectly crisp and nothing costs legibility.",
    scope: "panel",
    opts: { color: [0.55, 0.72, 1.0], distortion: 0.55, intensity: 0.6, blend: 0.4,
            radius: 0.32, force: 6200, densityDissipation: 0.975, velocityDissipation: 0.22, curl: 24 },
  },
  {
    id: "ink",
    name: "Ink",
    desc: "The loud one. Whole page inside, distortion 0.7 and heavy blend, so the words visibly bend and smear around the cursor. A statement, not a texture.",
    scope: "all",
    opts: { color: [0.91, 0.66, 0.49], distortion: 0.7, intensity: 0.85, blend: 0.55,
            radius: 0.4, force: 8000, densityDissipation: 0.99, velocityDissipation: 0.18, curl: 34 },
  },
  {
    id: "aurora",
    name: "Aurora",
    desc: "Rainbow mode: the trail takes colour from the direction of the flow. Wide radius, long persistence. Alive and playful, and a long way from dusk.",
    scope: "all",
    opts: { rainbow: true, distortion: 0.34, intensity: 0.75, blend: 0.45,
            radius: 0.45, force: 6000, densityDissipation: 0.992, velocityDissipation: 0.15, curl: 40 },
  },
  {
    id: "touch",
    name: "Touch",
    desc: "Headline only, tight radius, hard force, fast decay. The fluid exists for an instant right under the cursor, like touching still water.",
    scope: "headline",
    opts: { color: [1.0, 0.85, 0.63], distortion: 0.4, intensity: 0.7, blend: 0.3,
            radius: 0.09, force: 11000, densityDissipation: 0.94, velocityDissipation: 0.35, curl: 18 },
  },
];

const COPY = {
  desktop: {
    headline: "Your people are a constellation.",
    sub: "Every person you meet becomes a point of light - and Haven keeps them from drifting away.",
    cta: "Join", fine: "Private beta",
  },
  phone: {
    headline: "The people you meet, never lost again.",
    sub: "A quiet memory layer over the people of your life. Get in early.",
    cta: "Request access", fine: "No spam. Invites go out in waves.",
  },
};

let vi = 0, vp = "desktop", st = "form";
let instance = null, skyStop = null;

const frame = document.getElementById("frame");

/* Ported from src/DriftSky.tsx so the prototype rides the exact shipped sky. */
function startDrift(canvas) {
  const ctx = canvas.getContext("2d");
  if (!ctx) return () => {};
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const dpr = Math.min(devicePixelRatio || 1, 2);

  function build() {
    size();
    const count = Math.min(300, Math.floor((w * h) / 3600));
    stars = [];
    for (let i = 0; i < count; i++) {
      const d = Math.random();
      stars.push({ x: Math.random() * w, y: Math.random() * h, size: 0.5 + d * 1.6,
                   base: 0.1 + d * 0.45, sp: 0.05 + d * 0.22, tw: Math.random() * 6.28,
                   hot: Math.random() < 0.04 });
    }
  }
  function draw(t) {
    const time = t / 1000;
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      if (!reduce) { s.x += s.sp; if (s.x > w + 2) s.x = -2; }
      const tw = reduce ? 1 : 0.7 + 0.3 * Math.sin(time * 1.3 + s.tw);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, 6.2832);
      if (s.hot) {

        ctx.shadowColor = "rgba(10,132,255,.8)"; ctx.shadowBlur = 6;

function contentHTML() {
  const c = COPY[vp];
  if (st === "joined") {
    return '<div class="wl-content"><div class="wl-joined">' +
      '<div class="wl-check"><svg viewBox="0 0 24 24" fill="none" stroke="#0a84ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>' +
      '<p class="wl-checkline">You are on the list.</p>' +
      '<p class="wl-sub">Thank you for joining us, to be in the true social that brings you to other people in your life</p>' +
      '</div></div>';
  }
  return '<div class="wl-content">' +
    '<div class="wl-top"><span class="wl-eyebrow">Haven - private beta</span>' +
    '<h1 class="wl-headline" id="hl">' + c.headline + '</h1></div>' +
    '<div class="wl-bottom"><p class="wl-sub">' + c.sub + '</p>' +
    '<form class="wl-form" onsubmit="return false">' +
    '<div class="wl-row"><input class="wl-field" placeholder="Your name" aria-label="Your name">' +
    '<button class="wl-go" type="submit">' + c.cta + '</button></div>' +
    '</form><p class="wl-fine">' + c.fine + '</p></div></div>';
}

/* Liquid needs three elements: a source canvas holding the live DOM, the
   content itself, and an output canvas for the simulation.

   Three rules, each of which produced a black page or a dead effect when
   broken:
   1. The content div must be position:relative with an explicit 100% box.
      Inside a canvas layout subtree there is no containing block, so an
      absolutely positioned child collapses to nothing and the capture comes
      back empty.
   2. Nothing inside the captured subtree may itself be a <canvas>. The star
      field therefore always stays outside the fluid, as a plain background.

function buildShell(host, native) {
  const src = document.createElement("canvas");
  src.setAttribute("layoutsubtree", "true");
  src.style.cssText = native
    ? "position:absolute;inset:0;width:100%;height:100%"
    : "display:none";

  const content = document.createElement("div");
  content.style.cssText =
    "position:relative;width:100%;height:100%;overflow:hidden";

  const out = document.createElement("canvas");
  out.setAttribute("aria-hidden", "true");
  out.style.cssText =
    "position:absolute;inset:0;width:100%;height:100%;pointer-events:none";

  host.appendChild(src);
  if (native) src.appendChild(content); else host.appendChild(content);
  host.appendChild(out);
  return { source: src, content, output: out };
}

function nebulaHTML() {
  return '<div style="position:absolute;inset:0;background:' +
    'radial-gradient(58% 42% at 26% 30%, #1f3b7a66, transparent 70%),' +
    'radial-gradient(50% 36% at 76% 60%, #E8A87C3d, transparent 72%),' +
    'radial-gradient(76% 52% at 50% 96%, #2a2050cc, transparent 78%)"></div>';
}

function render() {
  if (instance) { instance.destroy(); instance = null; }
  if (skyStop) { skyStop(); skyStop = null; }

  const v = VARIANTS[vi];
  const native = supportsHtmlInCanvas();
  frame.innerHTML = "";

  // Rule 2: the star field is a canvas, so it lives outside the fluid always.
  const sky = document.createElement("canvas");
  sky.id = "sky";
  frame.appendChild(sky);

  let host, els;

  if (v.scope === "headline") {
    frame.insertAdjacentHTML("beforeend", contentHTML());
    const hl = frame.querySelector("#hl");
    host = document.createElement("div");
    host.style.cssText =
      "position:relative;height:" + Math.max(hl ? hl.offsetHeight : 0, 60) + "px";
    if (hl) {
      hl.replaceWith(host);
      els = buildShell(host, native);
      els.content.appendChild(hl);
    }
  } else if (v.scope === "panel") {
    host = document.createElement("div");
    host.style.cssText = "position:absolute;inset:0";
    frame.appendChild(host);
    els = buildShell(host, native);
    els.content.innerHTML = nebulaHTML();
    // Rule 3: the copy rides inside the host so its pointer events still
    // drive the fluid, while staying outside the captured subtree so the
    // type is never warped.
    host.insertAdjacentHTML("beforeend", contentHTML());
  } else {
    host = document.createElement("div");
    host.style.cssText = "position:absolute;inset:0";
    frame.appendChild(host);
    els = buildShell(host, native);
    els.content.innerHTML = contentHTML();
  }

  skyStop = startDrift(sky);
  if (els) instance = createLiquid(els, v.opts);
}

function paintPicker() {
  const v = VARIANTS[vi];
  document.getElementById("vname").textContent = v.name;
  document.getElementById("vnum").textContent = (vi + 1) + " / " + VARIANTS.length;
  document.getElementById("vdesc").textContent = v.desc;
}

function go(delta) {
  vi = (vi + delta + VARIANTS.length) % VARIANTS.length;
  paintPicker();
  render();
}

document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);

document.getElementById("vpseg").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  vp = b.dataset.vp;
  frame.dataset.vp = vp;
  [...e.currentTarget.children].forEach(x => x.classList.toggle("on", x === b));
  render();
};
document.getElementById("stseg").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  st = b.dataset.st;
  [...e.currentTarget.children].forEach(x => x.classList.toggle("on", x === b));
  render();
};

addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

/* draggable picker */
const picker = document.getElementById("picker");
const grab = document.getElementById("grab");
let drag = null;
grab.addEventListener("pointerdown", (e) => {
  const r = picker.getBoundingClientRect();
  drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  grab.setPointerCapture(e.pointerId);
});
grab.addEventListener("pointermove", (e) => {
  if (!drag) return;
  picker.style.left = (e.clientX - drag.dx) + "px";
  picker.style.top = (e.clientY - drag.dy) + "px";
  picker.style.right = "auto"; picker.style.bottom = "auto";
});
grab.addEventListener("pointerup", () => { drag = null; });

const showBtn = document.getElementById("show");
document.getElementById("hide").onclick = () => {
  picker.style.display = "none"; showBtn.style.display = "block";
};
showBtn.onclick = () => { picker.style.display = "flex"; showBtn.style.display = "none"; };

const flag = document.getElementById("flag");
if (supportsHtmlInCanvas()) {
  flag.className = "ok";
  flag.textContent = "html-in-canvas is on. You are seeing the real effect.";
} else {
  flag.textContent = "html-in-canvas is OFF, so every variant renders as plain HTML. Enable chrome://flags/#canvas-draw-element and restart Chrome.";
}

paintPicker();
render();
