/* ---------------------------------------------------------------------------
   Round 2. Ink settled the question of intensity: bold, whole-page, warm. This
   round keeps that appetite and swaps the instrument, because the five engines
   below have genuinely different characters rather than different settings.

   Every one of these takes the same {source, content, output} contract, and
   none of them bail when html-in-canvas is missing -- they simply have less to
   work with. Where a variant is empty-handed without the flag, its note says so.
--------------------------------------------------------------------------- */
const VARIANTS = [
  {
    id: "points",
    name: "Points of light",
    make: FX_particle_reveal,
    desc: "The page dissolves into drifting particles around the cursor and re-forms behind it. The most on-thesis of the five: the headline literally becomes points of light. Needs the flag.",
    needsFlag: true,
    opts: { radius: 420, softness: 0.8, size: 1.1, scatter: 30, drift: 1.2,
            aberration: 30, bend: 40, fade: 0.88, threshold: 0.08, background: "#000000" },
  },
  {
    id: "nebula",
    name: "Nebula",
    make: FX_clouds,
    desc: "Volumetric cloud drifting behind everything, tinted ember. Reads as deep-space gas rather than an effect, and it moves on its own instead of waiting to be touched.",
    needsFlag: false,
    // color takes [r,g,b] in 0-1, not a hex string; a string falls through the
    // "auto" check and renders as garbage. This is Ember (#E8A87C).
    // Low cover and opacity on purpose: the sky has to stay black behind the
    // stars, so this is wisps passing through, never overcast.
    opts: { scale: 2.4, speed: 0.26, cover: 0.1, density: 1.3, shading: 0.18,
            color: [0.91, 0.66, 0.49], opacity: 0.17, shadow: 0.03,

  },
  {

    make: FX_droplets,

const COPY = {
  desktop: {

let instance = null, skyStop = null;
const frame = document.getElementById("frame");

/* Ported from src/DriftSky.tsx so the prototype rides the exact shipped sky. */
function startDrift(canvas) {
  const ctx = canvas.getContext("2d");

      stars.push({ x: Math.random() * w, y: Math.random() * h, size: 0.5 + d * 1.6,

                   hot: Math.random() < 0.04 });

    const time = t / 1000;
    ctx.clearRect(0, 0, w, h);

function contentHTML() {

/* Three rules, each of which produced a black page or a dead effect in round 1:
   1. The content div must be position:relative with an explicit 100% box.
      Inside a canvas layout subtree there is no containing block, so an
      absolutely positioned child collapses and the capture comes back empty.
   2. Nothing inside the captured subtree may itself be a <canvas>, so the star
      field always stays outside the effect as a plain background.
   3. The engines listen on output.parentElement, so anything meant to drive
      them has to live inside the host and bubble up to it. */
function buildShell(host, native) {
  const src = document.createElement("canvas");
  src.setAttribute("layoutsubtree", "true");
  src.style.cssText = native
    ? "position:absolute;inset:0;width:100%;height:100%"
    : "display:none";

  const content = document.createElement("div");
  content.style.cssText = "position:relative;width:100%;height:100%;overflow:hidden";

  const out = document.createElement("canvas");
  out.setAttribute("aria-hidden", "true");
  out.style.cssText =
    "position:absolute;inset:0;width:100%;height:100%;pointer-events:none";

  host.appendChild(src);
  if (native) src.appendChild(content); else host.appendChild(content);
  host.appendChild(out);
  return { source: src, content, output: out };
}

function render() {
  if (instance) { try { instance.destroy(); } catch (e) {} instance = null; }
  if (skyStop) { skyStop(); skyStop = null; }

  const v = VARIANTS[vi];
  const native = supportsCapture();
  frame.innerHTML = "";

  // Rule 2: the star field is a canvas, so it lives outside the effect always.
  const sky = document.createElement("canvas");
  sky.id = "sky";
  frame.appendChild(sky);

  const host = document.createElement("div");
  host.style.cssText = "position:absolute;inset:0";
  frame.appendChild(host);

  const els = buildShell(host, native);
  els.content.innerHTML = contentHTML();

  skyStop = startDrift(sky);
  try {
    instance = v.make(els, v.opts);
  } catch (e) {
    instance = null;
    console.warn("effect failed:", v.id, e);
  }
}

/* All five bundles ship their own copy of this probe; one is enough here. */
function supportsCapture() {
  if (typeof document === "undefined") return false;
  const probe = document.createElement("canvas");
  const ctx = probe.getContext("2d");
  return Boolean(ctx && typeof ctx.drawElementImage === "function" &&
    typeof probe.requestPaint === "function");

function paintPicker() {
