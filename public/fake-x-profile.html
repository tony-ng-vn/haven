<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile / X</title>
<style>
  body { margin: 0; background: #000; color: #e7e9ea; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .frame { max-width: 600px; margin: 0 auto; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; min-height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 24px; padding: 8px 16px; }
  .back { font-size: 20px; }
  .topbar .who { font-weight: 700; font-size: 17px; }
  .topbar .count { color: #71767b; font-size: 13px; }
  .banner { height: 140px; background: linear-gradient(120deg, #1d3a5f, #3b2a52); }
  .avatar { width: 96px; height: 96px; border-radius: 50%; background: #4a628a; border: 4px solid #000; margin: -48px 0 0 16px; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: #dbe4f0; }
  .actions { display: flex; justify-content: flex-end; padding: 12px 16px 0; }
  .follow { background: #eff3f4; color: #0f1419; border: none; border-radius: 999px; padding: 8px 18px; font-weight: 700; font-size: 15px; }
  .info { padding: 8px 16px; }
  .name { font-size: 20px; font-weight: 800; margin: 0; }
  .handle { color: #71767b; margin: 2px 0 12px; font-size: 15px; }
  .bio { font-size: 15px; line-height: 1.4; margin: 0 0 12px; }
  .meta { color: #71767b; font-size: 15px; margin-bottom: 12px; }
  .stats { display: flex; gap: 20px; font-size: 14px; color: #71767b; }
  .stats b { color: #e7e9ea; }
  .tabs { display: flex; margin-top: 16px; border-bottom: 1px solid #2f3336; }
  .tab { flex: 1; text-align: center; padding: 14px 0; color: #71767b; font-weight: 600; font-size: 15px; }
  .tab.active { color: #e7e9ea; position: relative; }
  .tab.active::after { content: ""; position: absolute; bottom: 0; left: 35%; right: 35%; height: 4px; border-radius: 2px; background: #1d9bf0; }
</style>
</head>
<body>
  <div class="frame">
    <div class="topbar"><span class="back">&#8592;</span><div><div class="who">Rosalind Franklin</div><div class="count">4,281 posts</div></div></div>
    <div class="banner"></div>
    <div class="avatar">RF</div>
    <div class="actions"><button class="follow">Follow</button></div>
    <div class="info">
      <h1 class="name">Rosalind Franklin</h1>
      <p class="handle">@ros_franklin</p>
      <p class="bio">X-ray crystallographer. Photographing molecules until they confess their structure. DNA, viruses, and coal. Views are diffraction patterns.</p>
      <div class="meta">London &nbsp;&nbsp; Joined May 2019</div>
      <div class="stats"><span><b>512</b> Following</span><span><b>48.2K</b> Followers</span></div>
      <div class="tabs">
        <div class="tab active">Posts</div><div class="tab">Replies</div><div class="tab">Media</div><div class="tab">Likes</div>
      </div>
    </div>
  </div>
</body>
</html>
