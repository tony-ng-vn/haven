<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Haven (inhavens.com) is a personal memory layer over the people of your life - every person you meet becomes a point of light. Join the private beta." />
    <link rel="canonical" href="https://inhavens.com/" />
    <!-- Social preview. Card regenerated via scripts/generate-brand-assets.py
         from brand/nori.png (star field + Nori + Haven wordmark). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Haven" />
    <meta property="og:url" content="https://inhavens.com/" />
    <meta property="og:title" content="Haven" />
    <meta property="og:description" content="A personal memory layer over the people of your life." />
    <meta property="og:image" content="https://inhavens.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Haven" />
    <meta name="twitter:description" content="A personal memory layer over the people of your life." />
    <meta name="twitter:image" content="https://inhavens.com/og.png" />
    <!-- One theme, one night: the browser chrome wears the app's ground. -->
    <meta name="theme-color" content="#0e1123" />
    <!-- Site identity for search. "Inhavens" as alternateName ties the brand
         query to this site; Google reads WebSite/Organization on the homepage
         to pick the SERP site name and logo. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://inhavens.com/#org",
            "name": "Haven",
            "alternateName": ["Inhavens", "inhavens.com"],
            "url": "https://inhavens.com/",
            "logo": "https://inhavens.com/icon-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://inhavens.com/#website",
            "name": "Haven",
            "alternateName": ["Inhavens", "inhavens.com"],
            "url": "https://inhavens.com/",
            "publisher": { "@id": "https://inhavens.com/#org" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://valued-bonefish-64.clerk.accounts.dev" crossorigin />
    <link rel="preconnect" href="https://third-hound-186.convex.cloud" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Safari does not read the manifest icons; apple-touch-icon must be set explicitly. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Haven (Inhavens) - A personal memory layer for your people</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>Haven (inhavens.com) - a personal memory layer over the people of your life.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
