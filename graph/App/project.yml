name: ConnectionGraph
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: "YES"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
# Signing keys (CODE_SIGN_IDENTITY, CODE_SIGN_STYLE, DEVELOPMENT_TEAM, CODE_SIGNING_*) live
# in Signing.xcconfig, not here: an explicit YAML setting on the target always overrides an
# xcconfig value for the same key, so those keys must NOT also appear under `settings:`
# above or under the target's own `settings:` below, or the xcconfig (and the
# machine-specific override it optionally includes) would have no effect. See SIGNING.md.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
# Local package one directory up: this is graph/'s own SwiftPM package (GraphCore +
# graph-cli), not a remote dependency. Kept separate from graph/Package.swift on purpose
# so the CLI and its tests never gain an Xcode/AppKit dependency.
packages:
  GraphCore:
    path: "../"
targets:
  ConnectionGraph:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # The sky viewer template lives in graph/viewer/, not under App/, because it is shared
      # with viewer/build.py's own standalone (non-app) export path -- copying it here instead
      # of moving it would make the two drift. `buildPhase: resources` (rather than relying on
      # extension inference) is what actually gets it into Copy Bundle Resources; a bare path
      # here would otherwise be treated as a source file. template-sky.html (the two-plane
      # ringed sky, the app's only graph presentation) declares the viewer-core placeholder,
      # which sky_lens.mjs (the connection lens's pure neighbor-selection logic) fills -- so
      # both resources ship together, the same way build.py inlines them for the standalone
      # export path.
      - path: ../viewer/template-sky.html
        buildPhase: resources
      - path: ../viewer/sky_lens.mjs
        buildPhase: resources
    dependencies:
      - package: GraphCore
        product: GraphCore
    settings:
      base:
        # PRODUCT_NAME drives CFBundleName, and CFBundleName -- not
        # CFBundleDisplayName -- is what System Settings' Privacy & Security
        # lists (Full Disk Access, Contacts, ...) show. Xcode's auto-generated
        # Info.plist (GENERATE_INFOPLIST_FILE=YES) hardcodes CFBundleName to
        # PRODUCT_NAME regardless of any INFOPLIST_KEY_CFBundleName override --
        # confirmed by -showBuildSettings resolving the override correctly while
        # the built Info.plist still showed the old name -- so renaming here is
        # the only way to make the name the app asks for match the name shown
        # on the authorize screen it sends the user to.
        PRODUCT_NAME: "Your Sky"
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.ConnectionGraph
        # No CODE_SIGN_ENTITLEMENTS and no App Sandbox capability: chat.db and the
        # AddressBook databases live under Full Disk Access, which a sandboxed app
        # cannot be granted access to. There is deliberately no entitlements file here.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Bundle id stays dev.local.ConnectionGraph on purpose and must never change:
        # TCC keys a signed app's Full Disk Access grant on its designated requirement
        # (bundle id + certificate), and changing the bundle id would strand a grant
        # the same way an ad-hoc rebuild does today. See SIGNING.md for why ad-hoc
        # signing (Signing.xcconfig's default) makes every rebuild look like a new app
        # regardless of this setting, and how to move to a stable identity.
        INFOPLIST_KEY_CFBundleDisplayName: "Your Sky"
