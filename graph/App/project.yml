name: ConnectionGraph
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: "YES"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Ad-hoc signing: no Apple team on this machine, and none is needed for a
    # local-only personal tool that never leaves it.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
# Local package one directory up: this is graph/'s own SwiftPM package (GraphCore +
# graph-cli), not a remote dependency. Kept separate from graph/Package.swift on purpose
# so the CLI and its tests never gain an Xcode/AppKit dependency.
packages:
  GraphCore:
    path: "../"
targets:
  ConnectionGraph:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # The sky viewer template and its core logic live in graph/viewer/, not under App/,
      # because they are shared with viewer/build.py's own standalone (non-app) export path --
      # copying them here instead of moving them would make the two drift. `buildPhase:
      # resources` (rather than relying on extension inference) is what actually gets each
      # into Copy Bundle Resources; a bare path here would otherwise be treated as a source
      # file. Both are needed: template-v4.html has TWO placeholders now
      # (__VIEWER_CORE_JS__ and __GRAPH_JSON__), and viewer_core.mjs is what fills the first.
      - path: ../viewer/template-v4.html
        buildPhase: resources
      - path: ../viewer/viewer_core.mjs
        buildPhase: resources
    dependencies:
      - package: GraphCore
        product: GraphCore
    settings:
      base:
        # PRODUCT_NAME drives CFBundleName, and CFBundleName -- not
        # CFBundleDisplayName -- is what System Settings' Privacy & Security
        # lists (Full Disk Access, Contacts, ...) show. Xcode's auto-generated
        # Info.plist (GENERATE_INFOPLIST_FILE=YES) hardcodes CFBundleName to
        # PRODUCT_NAME regardless of any INFOPLIST_KEY_CFBundleName override --
        # confirmed by -showBuildSettings resolving the override correctly while
        # the built Info.plist still showed the old name -- so renaming here is
        # the only way to make the name the app asks for match the name shown
        # on the authorize screen it sends the user to.
        PRODUCT_NAME: "Your Sky"
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.ConnectionGraph
        # No CODE_SIGN_ENTITLEMENTS and no App Sandbox capability: chat.db and the
        # AddressBook databases live under Full Disk Access, which a sandboxed app
        # cannot be granted access to. There is deliberately no entitlements file here.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Bundle id stays dev.local.ConnectionGraph on purpose: Full Disk Access
        # on a signed app is granted per bundle identifier, and changing it would
        # strand a grant. (This build is unsigned, so TCC likely keys off the
        # binary path/hash here anyway and a re-grant is needed after any rebuild
        # regardless of this setting -- worth re-verifying once real code signing
        # is in place.)
        INFOPLIST_KEY_CFBundleDisplayName: "Your Sky"
