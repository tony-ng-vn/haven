name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # The convex tests stub all network calls, but the OpenAI client
          # asserts a key exists before the stubbed fetch is ever reached.
          OPENAI_API_KEY: ci-dummy-key-network-is-mocked
      - run: npm run build

  ios-test:
    # Separate job because xcodebuild only exists on macOS, and macOS minutes
    # are billed at a higher multiplier than the Linux job above.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      # The image's default Xcode decides which Swift tools version the SDKs
      # get compiled with, so print it: a resolve failure here is unreadable
      # without knowing which Xcode ran.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - run: brew install xcodegen

      # The .xcodeproj is git-ignored and generated from project.yml, so a
      # fresh checkout has no project to build until this runs.
      - run: xcodegen generate

      # Package versions live in project.yml, so that is the cache key. The
      # prefix restore key still saves most of the resolve when it changes.
      - uses: actions/cache@v4
        with:
          path: ios/.spm-cache
          key: ios-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: ios-spm-

      # Resolving a device at runtime instead of hardcoding a name: GitHub's
      # macOS image ships a different simulator set than any dev machine, and
      # the set changes with every image bump.
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("SimRuntime\\.iOS")))
            | sort_by(.key | [scan("[0-9]+") | tonumber])
            | (last // {}).value // []
            | map(select(.name | startswith("iPhone")))
            | (last // {}).udid // ""
          ')
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      # Raw xcodebuild output on purpose. The run logs expected Clerk keychain
      # errors (OSStatus -34018, no entitlement without code signing), and a
      # formatter pipe would also cost us xcodebuild's exit code.
      - name: Run tests
        run: |
          xcodebuild test -project Haven.xcodeproj -scheme Haven \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO
