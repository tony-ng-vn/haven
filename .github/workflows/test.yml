name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # The convex tests stub all network calls, but the OpenAI client
          # asserts a key exists before the stubbed fetch is ever reached.
          OPENAI_API_KEY: ci-dummy-key-network-is-mocked
      - run: npm run build
