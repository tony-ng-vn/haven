name: Haven
options:
  bundleIdPrefix: com.inhavens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Versions what people install from the App Store, and moves only when an
    # iOS build ships -- not with package.json, which versions the codebase.
    #
    # 1.0.0 because the next archive is the App Store submission, and a first
    # release numbered 0.1.0 tells everyone who sees the listing that this is a
    # beta. Nothing in the store is versioned from zero.
    MARKETING_VERSION: "1.0.0"
    # Bump on every upload, including a resubmission after a rejection: App
    # Store Connect refuses a build whose number it has already seen, and the
    # rejection for it arrives after the upload has finished.
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    SWIFT_VERSION: "5.0"
    # The owner's free personal team, pinned here because xcodegen rewrites
    # the project and a team chosen by hand in Xcode is wiped on every
    # regenerate. A personal team signs simulator and device dev builds; the
    # App Store submission will need the paid program and a real team id in
    # this same line.
    DEVELOPMENT_TEAM: WYMJ4KK3T2
    # iPhone only. Unset, Xcode fills this in as "1,2" and the build tells the
    # App Store it is an iPad app too -- which Haven has never been. There is no
    # size-class handling anywhere in ios/Haven, so every screen would be a phone
    # layout sitting in a 13-inch window. Apple reviews an app on every device it
    # claims, so the default was a promise made by omission.
    #
    # Reversible: the day somebody opens Haven on an iPad, looks at every screen,
    # and adds the adaptive layout, this becomes "1,2" in the same commit.
    TARGETED_DEVICE_FAMILY: "1"
    # Portrait only, for the same reason and with a wider blast radius: absent,
    # every orientation is permitted, including landscape on iPhone. No screen
    # here has been designed sideways. Upside-down is excluded by not being
    # listed, which also matches what iOS does with a phone by default.
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    # Phase 1 has no light mode (HavenColor is a single dusk palette), so the
    # app declares dark to the system. This also fixes two real bugs: in light
    # mode the status bar clock rendered black on the night background, and the
    # generated launch screen flashed white before the first frame. Declared
    # dark, the launch screen renders black, which hands off into the night
    # gradient instead of flashing.
    INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: "0.8.0"
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.3.0"
  ClerkConvex:
    url: https://github.com/clerk/clerk-convex-swift
    exactVersion: "0.1.0"
  # Phone numbers are only worth collecting if they are real ones, and knowing
  # whether +84 90 000 0000 is real means carrying libphonenumber's rules.
  #
  # This is the PhoneNumberKit org's repository and the 5.x line, not
  # marmelroy's 4.x: ClerkKitUI already depends on exactly that, and asking for
  # any other one makes the dependency graph unsolvable.
  PhoneNumberKit:
    url: https://github.com/PhoneNumberKit/PhoneNumberKit
    from: "5.0.0"
targets:
  Haven:
    type: application
    platform: iOS
    sources:
      - path: Haven
    dependencies:
      - package: ConvexMobile
        product: ConvexMobile
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: ClerkConvex
        product: ClerkConvex
      - package: PhoneNumberKit
        product: PhoneNumberKit
      # Embeds the widget in the app. Without this the extension builds but
      # never ships inside the bundle, so it never appears in the widget
      # gallery and the whole feature is invisible.
      - target: HavenWidget
      # Same for the share extension: unembedded, Haven never appears in
      # anybody's share sheet.
      - target: HavenShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inhavens.haven
        # Haven/Info.plist carries the UILaunchScreen dict (the launch colour
        # has no INFOPLIST_KEY_* form); everything else is still generated and
        # merged in. The generation flag for the launch screen is gone on
        # purpose: it emits an empty UILaunchScreen that would fight the file's.
        INFOPLIST_FILE: Haven/Info.plist
        # Clerk iOS persists its device token in the keychain; without a
        # keychain-access-group entitlement it fails with OSStatus -34018 and
        # sign-in returns 401 "signed out".
        CODE_SIGN_ENTITLEMENTS: Haven/Haven.entitlements
    # ConvexMobile ships no x86_64 simulator slice, so `-configuration Release`
    # for the simulator fails with undefined UniFFI symbols on an Intel Mac,
    # and would fail in CI the day CI built Release without pinning the
    # architecture. Device and App Store builds are arm64 and unaffected.
    #
    # Found in PR 110 on unmodified main, so it is a fact about the dependency
    # rather than about anything Haven does. Recorded here, next to the build
    # settings, because a note in a merged pull request body is not somewhere
    # anybody looks when a build breaks.
    scheme:
      testTargets:
        - HavenTests

  HavenWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HavenWidget
      # Named file, not the Haven directory: the widget is a separate process
      # that must not pull in Clerk or Convex, and globbing the app's sources
      # would drag both in through the first file that imports them.
      - path: Haven/HavenDeepLink.swift
    dependencies: []
    settings:
      base:
        # Must be a child of the app's identifier. A sibling builds fine and
        # then fails at install, which reads as a runtime mystery.
        PRODUCT_BUNDLE_IDENTIFIER: com.inhavens.haven.widget
        # The name under the widget in the gallery.
        INFOPLIST_KEY_CFBundleDisplayName: Haven
        # Carries NSExtensionPointIdentifier, which has no build-setting form.
        INFOPLIST_FILE: HavenWidget/Info.plist

  HavenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HavenShare
      # The offline core, compiled into this process too. One directory rather
      # than a growing list of named files, and it imports nothing but
      # Foundation on purpose: a share extension is killed if it is slow to
      # launch, and pulling Clerk and Convex in here would be both.
      - path: Haven/Shared
      # Named files, not the Design directory: HavenCard is built on MyCard,
      # which is the app's Convex-decoded model, and globbing would pull that
      # whole side in through one file.
      #
      # The sheet draws on the first seven. The last two are here because
      # #Preview blocks compile like any other code and reach across files:
      # NightBackground's preview composes DustLayer, which seeds itself from
      # SkyGenerator. Neither is drawn in this process.
      - path: Haven/Design/HavenColor.swift
      - path: Haven/Design/ColorMath.swift
      - path: Haven/Design/HavenFont.swift
      - path: Haven/Design/HavenMotion.swift
      - path: Haven/Design/HavenField.swift
      - path: Haven/Design/HavenButtons.swift
      - path: Haven/Design/NightBackground.swift
      - path: Haven/Design/DustLayer.swift
      - path: Haven/SkyGenerator.swift
    dependencies: []
    settings:
      base:
        # Must be a child of the app's identifier. A sibling builds fine and
        # then fails at install, which reads as a runtime mystery.
        PRODUCT_BUNDLE_IDENTIFIER: com.inhavens.haven.share
        # The name on the icon in the share sheet.
        INFOPLIST_KEY_CFBundleDisplayName: Haven
        # Carries the NSExtension dict, which has no build-setting form.
        INFOPLIST_FILE: HavenShare/Info.plist
        # The App Group. Without it the extension writes into its own private
        # container and the app drains an empty queue forever.
        CODE_SIGN_ENTITLEMENTS: HavenShare/HavenShare.entitlements

  HavenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HavenTests
    dependencies:
      - target: Haven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inhavens.haven.tests
        GENERATE_INFOPLIST_FILE: "YES"
